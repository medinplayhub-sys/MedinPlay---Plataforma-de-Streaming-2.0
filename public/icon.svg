<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fondo degradado Negro -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="50%" stop-color="#0d0d0d" />
      <stop offset="100%" stop-color="#020202" />
    </linearGradient>
    
    <!-- Degradado Dorado Premium -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#F4C430" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    
    <!-- Degradado Morado Real -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B21A8" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    
    <!-- Glow Dorado -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Glow Morado -->
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base redondeada negra -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.5" />

  <!-- Ambient Glow Morado de fondo -->
  <circle cx="256" cy="256" r="140" fill="#9333EA" opacity="0.15" filter="url(#purpleGlow)" />
  
  <!-- Triángulo de Play Dorado con glow -->
  <path d="M 200 160 L 340 256 L 200 352 Z" fill="url(#goldGrad)" filter="url(#goldGlow)" />
  
  <!-- Letra 'M' estilizada en Morado sobre el play -->
  <path d="M 220 200 L 245 256 L 220 312 L 240 312 L 256 276 L 272 312 L 292 312 L 267 256 L 292 200 L 272 200 L 256 244 L 240 200 Z" fill="#6B21A8" opacity="0.95" />

  <!-- Badge 4K Dorado -->
  <g transform="translate(196, 380)">
    <rect width="120" height="32" rx="16" fill="#D4AF37" opacity="0.2" stroke="#D4AF37" stroke-width="1.5" />
    <text x="60" y="21" fill="#F4C430" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" text-anchor="middle" letter-spacing="2">4K • PLAY</text>
  </g>
</svg>
