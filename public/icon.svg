<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Base Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#accentGrad)" stroke-width="4" opacity="0.4" />
  
  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="160" fill="#f59e0b" opacity="0.12" filter="url(#glow)" />
  <circle cx="210" cy="240" r="120" fill="#8b5cf6" opacity="0.1" filter="url(#glow)" />

  <!-- Play Symbol & MedinPlay Core Logo -->
  <g transform="translate(40, 20)">
    <!-- Stylized Play Polygon with Golden Gradient -->
    <path d="M 180 130 L 330 236 L 180 342 Z" fill="url(#accentGrad)" filter="url(#glow)" />
    
    <!-- Stylized 'M' Inner Core Overlay -->
    <path d="M 160 170 L 195 236 L 160 302 L 190 302 L 215 250 L 240 302 L 270 302 L 235 236 L 270 170 L 240 170 L 215 222 L 190 170 Z" fill="#020617" opacity="0.9" />
  </g>

  <!-- HD 4K Badge -->
  <g transform="translate(196, 390)">
    <rect width="120" height="32" rx="16" fill="#f59e0b" opacity="0.15" stroke="#f59e0b" stroke-width="1.5" />
    <text x="60" y="21" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" text-anchor="middle" letter-spacing="2">4K • IPTV</text>
  </g>
</svg>
