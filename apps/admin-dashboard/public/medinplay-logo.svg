<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <!-- Gradiente Dorado Premium -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE57F" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    
    <!-- Gradiente Morado Neón -->
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95" />
      <stop offset="100%" stop-color="#1E1035" />
    </linearGradient>

    <!-- Resplandor Dorado -->
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Isotipo: Contenedor Morado con Borde Dorado -->
  <g transform="translate(10, 10)">
    <rect width="100" height="100" rx="28" fill="url(#purple-grad)" stroke="url(#gold-grad)" stroke-width="3" />
    <!-- M Elegante en fondo -->
    <path d="M 28,72 L 28,32 L 50,52 L 72,32 L 72,72" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.15"/>
    <!-- Triángulo Play Dorado -->
    <polygon points="42,34 72,50 42,66" fill="url(#gold-grad)" filter="url(#gold-glow)" />
  </g>

  <!-- Tipografía MedinPlay -->
  <text x="135" y="72" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="50" fill="#FFFFFF" letter-spacing="1">
    Medin<tspan fill="url(#gold-grad)">Play</tspan>
  </text>
  
  <!-- Subtítulo o Detalle Elegante -->
  <circle cx="485" cy="40" r="4" fill="url(#gold-grad)" />
</svg>
